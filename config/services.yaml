# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.default_locale: '%env(APP_DEFAULT_LOCALE)%'
    app.default_currency: '%env(APP_DEFAULT_CURRENCY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Fixture/'
            - '../src/Kernel.php'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: [ 'controller.service_arguments' ]

    app.fixture.example_factory.product_demonstration:
        class: App\Fixture\Factory\ProductDemonstrationExampleFactory
        arguments:
            - '@app.factory.product_demonstration'
        public: true

    app.fixture.product_demonstration:
        class: App\Fixture\ProductDemonstrationFixture
        arguments:
            - "@doctrine.orm.default_entity_manager"
            - "@app.fixture.example_factory.product_demonstration"
        tags:
            - { name: sylius_fixtures.fixture }

    app.form.type.product_demonstration:
        class: App\Form\Product\ProductDemonstrationType
        arguments:
            - '@App\Utils\UserAccessHelperInterface'
            - App\Entity\Product\ProductDemonstration
            - [ 'sylius', 'app_product_demonstration' ]
        tags:
            - { name: form.type }
