sylius_shop:
    resource: "@SyliusShopBundle/Resources/config/routing.yml"
    prefix: /{_locale}
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$

sylius_shop_payum:
    resource: "@SyliusShopBundle/Resources/config/routing/payum.yml"

sylius_shop_default_locale:
    path: /
    methods: [GET]
    defaults:
        _controller: sylius.controller.shop.locale_switch::switchAction

sylius_shop_override_paypal:
    resource: "@SyliusPayPalPlugin/Resources/config/sylius_shop_override_routing.yaml"
    prefix: /{_locale}
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$

# see https://web.dev/change-password-url/
sylius_shop_request_password_reset_token_redirect:
    path: /.well-known/change-password
    methods: [GET]
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: sylius_shop_request_password_reset_token
        permanent: false

app_shop_account_product_demonstration:
    resource: |
        alias: app.product_demonstration
        path: /product-demonstrations
        section: shop_account
        templates: "@SyliusShop\\Account\\ProductDemonstration"
        grid: app_product_demonstration
    type: sylius.resource
    prefix: /{_locale}/account

app_shop_account_product_demonstration_toggle_featured:
    path: /{_locale}/account/product-demonstrations/{id<\d+>}/toggle-featured
    methods: [PATCH]
    controller: App\Controller\Product\ProductDemonstrationController::toggleFeaturedAction
    defaults:
        _sylius:
            redirect: app_shop_account_product_demonstration_index
            section: shop_account
